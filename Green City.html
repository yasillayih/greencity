<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Green City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sticky bar, hero with live city model (scene + toggles + metrics), then calculator, roadmap tabs, pledge list. */
:root{
  --bg:#EDF2EE; --surface:#F8FBF8; --fg:#10261D; --muted:#4A6156; --line:#C9D7CE; --tint:#DCEEE2;
  --green:#1B7447; --green2:#58A96A; --leaf:#93CE74; --sun:#F0B03A; --oncol:#FFFFFF;
  --sky:#CDE7EE; --smog:#B9A98B; --bld:#8DA297; --bld2:#A9BBB1; --win:#D8E6DE; --ground:#B4AFA0;
  --road:#55645D; --panel:#2B4768; --water:#4AA3C8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1511; --surface:#12221B; --fg:#E3EFE7; --muted:#9CB4A6; --line:#24392F; --tint:#173226;
    --green:#55C58A; --green2:#3F9A62; --leaf:#4F8F3F; --sun:#E8B04A; --oncol:#07130D;
    --sky:#14303A; --smog:#7A6B52; --bld:#2F4A42; --bld2:#243A33; --win:#5E8574; --ground:#2A2F28;
    --road:#1B2622; --panel:#3C628F; --water:#3E93B8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1511; --surface:#12221B; --fg:#E3EFE7; --muted:#9CB4A6; --line:#24392F; --tint:#173226;
  --green:#55C58A; --green2:#3F9A62; --leaf:#4F8F3F; --sun:#E8B04A; --oncol:#07130D;
  --sky:#14303A; --smog:#7A6B52; --bld:#2F4A42; --bld2:#243A33; --win:#5E8574; --ground:#2A2F28;
  --road:#1B2622; --panel:#3C628F; --water:#3E93B8; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.02em}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font:700 19px var(--display);letter-spacing:-.02em;color:var(--fg);text-decoration:none;margin-right:auto}
.brand svg{width:26px;height:26px}
.top nav{display:flex;gap:22px;margin-right:10px}
.top nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.top nav a:hover{color:var(--fg)}
@media (max-width:700px){.top nav{display:none}}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 13px var(--body);cursor:pointer}
.ghost:hover{border-color:var(--green)}
.btn{background:var(--green);color:var(--oncol);border:0;border-radius:10px;padding:13px 20px;font:700 15px var(--body);cursor:pointer}
.btn:hover{filter:brightness(1.08)}

/* hero */
.hero{padding-block:44px 28px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
h1{font-size:clamp(2.5rem,7.4vw,5.2rem);line-height:1.02;font-weight:760;max-width:17ch}
h1 em{font-style:normal;color:var(--green)}
.lede{max-width:58ch;margin-top:20px;font-size:1.08rem;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-top:26px}
.link{font-weight:700;text-decoration:none;border-bottom:2px solid var(--green2)}

/* model */
.model-sec{padding-block:8px 56px}
.model{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.model{grid-template-columns:minmax(0,1fr) 330px}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.stage svg{display:block;width:100%;height:auto}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:14px}
.chip{display:grid;grid-template-columns:auto 1fr auto;gap:1px 10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;color:var(--fg);font-family:var(--body);min-width:0}
.chip:hover{border-color:var(--green2)}
.chip .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--green);grid-row:1 / span 2}
.chip .nm{font-weight:700;font-size:14px}
.chip small{grid-column:2;color:var(--muted);font-size:12px;line-height:1.35}
.chip .pts{font:500 12px var(--mono);color:var(--muted);grid-row:1 / span 2}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--green)}
.chip[aria-pressed="true"] .dot{background:var(--green)}
.chip[aria-pressed="true"] .pts{color:var(--green)}
.stagefoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;padding:0 14px 14px}
.stagefoot p{font-size:12.5px;color:var(--muted)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.gauge{display:flex;align-items:center;gap:16px}
.gauge svg{width:112px;height:112px;flex:none}
.gauge h3{font-size:1.15rem}
.gauge p{font-size:13px;color:var(--muted);margin-top:2px}
#ring{transition:stroke-dashoffset .7s ease}
.m .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.m b{font:700 1.5rem var(--display);color:var(--fg);letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right}
.bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--green);width:0;transition:width .7s ease}
.m .mn{font-size:12px;color:var(--muted);margin-top:5px}

/* generic sections */
.sec{padding-block:64px;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(1.8rem,4.4vw,2.9rem);line-height:1.06;font-weight:720;max-width:20ch}
.sec .intro{max-width:60ch;margin-top:14px;color:var(--muted)}
.sec .eyebrow{margin-bottom:12px}

/* calculator */
.calc{display:grid;gap:28px;margin-top:30px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.calc{grid-template-columns:minmax(0,380px) minmax(0,1fr)}}
.field{margin-bottom:20px}
.field label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}
.field output{font:500 14px var(--mono);color:var(--green)}
input[type=range]{width:100%;accent-color:var(--green);height:28px;margin:0}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 20px;margin-top:6px}
.res div{border-top:2px solid var(--green2);padding-top:10px}
.res b{display:block;font:700 1.9rem/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.res span{font-size:13px;color:var(--muted)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox .tx{font:11px var(--mono);fill:var(--muted)}
.chartbox .strong{fill:var(--fg);font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:12px}

/* roadmap */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:30px;padding-bottom:4px}
.tab{flex:none;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font:500 13px var(--mono);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--oncol)}
.panel{display:grid;gap:22px;margin-top:18px;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
@media (min-width:820px){.panel{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);padding:30px}}
.panel h3{font-size:1.7rem;line-height:1.15}
.panel ul{margin:14px 0 0;padding-left:20px;display:grid;gap:8px}
.panel li::marker{color:var(--green2)}
.goal{background:var(--tint);border-radius:10px;padding:20px;align-self:start}
.goal span{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.goal b{display:block;font:700 2.4rem/1.05 var(--display);letter-spacing:-.02em;margin-top:8px;color:var(--green)}
.goal p{font-size:13.5px;color:var(--muted);margin-top:6px}

/* pledge */
.pledge{display:grid;gap:26px;margin-top:30px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.pledge{grid-template-columns:minmax(0,1fr) 340px}}
.habits{display:grid;gap:8px}
.habit{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer}
.habit:hover{border-color:var(--green2)}
.habit input{width:20px;height:20px;accent-color:var(--green);flex:none;margin:0}
.habit span{flex:1;min-width:0;font-weight:600}
.habit small{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.habit:has(input:checked){background:var(--tint);border-color:var(--green)}
.total{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;align-self:start}
.total b{display:block;font:700 2.8rem/1 var(--display);letter-spacing:-.03em;color:var(--green);font-variant-numeric:tabular-nums}
.total p{color:var(--muted);font-size:14px;margin-top:8px}

footer{padding-block:34px 44px;border-top:1px solid var(--line)}
footer p{font-size:13px;color:var(--muted);max-width:70ch}

/* scene */
.layer{opacity:0;transition:opacity .7s ease}
.layer.on{opacity:1}
.inv{opacity:1;transition:opacity .7s ease}
.inv.off{opacity:0}
.grow{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.25);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.layer.on .grow{transform:scale(1)}
@keyframes ride{from{transform:translateX(-60px)}to{transform:translateX(860px)}}
@keyframes tram{from{transform:translateX(-230px)}to{transform:translateX(840px)}}
.rider{animation:ride 16s linear infinite;animation-delay:-6s}
.tramcar{animation:tram 22s linear infinite;animation-delay:-10s}
#smog{transition:opacity .8s ease}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .layer,.inv,.grow,#smog,#ring,.bar2 i{transition:none}
  .rider{animation:none;transform:translateX(420px)}
  .tramcar{animation:none;transform:translateX(300px)}
}
</style>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#top" data-al="brandAl">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27C5 14 13 6 27 5c0 14-8 22-20 22Z" fill="var(--green)"/><path d="M6 26C12 19 17 14 23 10" stroke="var(--bg)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span data-i="brand"></span>
    </a>
    <nav data-al="navAl">
      <a href="#model" data-i="navModel"></a><a href="#hesab" data-i="navCalc"></a><a href="#yol" data-i="navRoad"></a><a href="#oehdelik" data-i="navPledge"></a>
    </nav>
    <button class="ghost" id="themeBtn" type="button" data-i="theme" data-al="themeAl"></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow" data-i="eyebrow"></p>
      <h1 data-i="h1"></h1>
      <p class="lede" data-i="lede"></p>
      <div class="cta">
        <button class="btn" id="playBtn" type="button"></button>
        <a class="link" href="#yol" data-i="roadLink"></a>
      </div>
    </div>
  </section>

  <section class="model-sec" id="model" data-al="modelAl">
    <div class="wrap model">
      <div class="stage">
        <svg id="scene" viewBox="0 0 800 400" role="img"></svg>
        <div class="chips" id="chips"></div>
        <div class="stagefoot">
          <p data-i="foot"></p>
          <button class="ghost" id="resetBtn" type="button" data-i="reset"></button>
        </div>
      </div>
      <aside class="side" data-al="sideAl">
        <div class="gauge">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>
            <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 60 60)"/>
            <text id="mIdx" x="60" y="66" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="34" fill="var(--fg)">0</text>
            <text x="60" y="84" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">/ 100</text>
          </svg>
          <div><h3 data-i="gTitle"></h3><p data-i="gSub"></p></div>
        </div>
        <div class="m"><div class="mh"><span data-i="mCo2L"></span><b id="mCo2">0%</b></div><div class="bar2"><i id="bCo2"></i></div><p class="mn" data-i="mCo2N"></p></div>
        <div class="m"><div class="mh"><span data-i="mTempL"></span><b id="mTemp">0 °C</b></div><div class="bar2"><i id="bTemp"></i></div><p class="mn" data-i="mTempN"></p></div>
        <div class="m"><div class="mh"><span data-i="mAqiL"></span><b id="mAqi">118</b></div><div class="bar2"><i id="bAqi"></i></div><p class="mn" id="mAqiN"></p></div>
        <div class="m"><div class="mh"><span data-i="mEnL"></span><b id="mEn">6%</b></div><div class="bar2"><i id="bEn"></i></div><p class="mn" data-i="mEnN"></p></div>
        <p class="sr" id="live" aria-live="polite"></p>
      </aside>
    </div>
  </section>

  <section class="sec" id="hesab">
    <div class="wrap">
      <p class="eyebrow" data-i="calcEy"></p>
      <h2 data-i="calcH"></h2>
      <p class="intro" data-i="calcIntro"></p>
      <div class="calc">
        <div>
          <div class="field"><label for="inTrees"><span data-i="lTrees"></span> <output id="outTrees">25000</output></label>
            <input type="range" id="inTrees" min="1000" max="100000" step="1000" value="25000"></div>
          <div class="field"><label for="inYears"><span data-i="lYears"></span> <output id="outYears">10</output></label>
            <input type="range" id="inYears" min="1" max="30" step="1" value="10"></div>
          <div class="res">
            <div><b id="rTotal">0</b><span data-i="rTotalL"></span></div>
            <div><b id="rCars">0</b><span data-i="rCarsL"></span></div>
            <div><b id="rShade">0</b><span data-i="rShadeL"></span></div>
          </div>
        </div>
        <div class="chartbox">
          <svg id="chart" viewBox="0 0 600 250" role="img" data-al="chartAl"></svg>
          <p class="note" data-i="calcNote"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="sec" id="yol">
    <div class="wrap">
      <p class="eyebrow" data-i="roadEy"></p>
      <h2 data-i="roadH"></h2>
      <p class="intro" data-i="roadIntro"></p>
      <div class="tabs" role="tablist" id="tabs" data-al="tabsAl"></div>
      <div class="panel" role="tabpanel" id="panel" tabindex="0"></div>
    </div>
  </section>

  <section class="sec" id="oehdelik">
    <div class="wrap">
      <p class="eyebrow" data-i="plEy"></p>
      <h2 data-i="plH"></h2>
      <p class="intro" data-i="plIntro"></p>
      <div class="pledge">
        <div class="habits" id="habits"></div>
        <div class="total" aria-live="polite">
          <b id="pKg">0</b>
          <p id="pTxt"></p>
          <div class="bar2" style="margin-top:14px"><i id="pBar"></i></div>
          <p class="note" data-i="plNote"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap"><p data-i="foot2"></p></div>
</footer>

var cur={},tok={};

  var el=$('#'+id),from=cur[id];cur[id]=to;tok[id]=(tok[id]||0)+1;var my=tok[id];

    var p=Math.min(1,(tm-t0)/d),e=1-Math.pow(1-p,3);

}

/* ---------- tree calculator ---------- */
function uptake(i){return 22*Math.min(1,i/10)}
function cum(n,y){var tt=0;for(var i=1;i<=y;i++)tt+=uptake(i);return n*tt/1000}
function nice(max){var p=Math.pow(10,Math.floor(Math.log10(max/4)));var m=max/4/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function fmtT(v){return v>=100?fmt(v):v>=1?dec(v.toFixed(1)):dec(v.toFixed(2))}
function drawChart(n,y){
  var W=600,H=250,l=54,r=18,tp=28,b=34;
  var max=cum(n,y),step=nice(max),top=Math.ceil(max/step-1e-9)*step||step;
  var X=function(i){return l+(W-l-r)*i/y},Y=function(v){return H-b-(H-b-tp)*v/top};
  var s='';
  for(var v=0;v<=top+1e-9;v+=step){s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="tx">'+fmtT(v)+'</text>';}
  var xs=y<=10?1:y<=20?2:5;
  for(var i=0;i<=y;i+=xs){s+='<text x="'+X(i)+'" y="'+(H-b+18)+'" text-anchor="middle" class="tx">'+i+'</text>';}
  var pts=[];for(var j=0;j<=y;j++)pts.push([X(j),Y(cum(n,j))]);
  var line=pts.map(function(p,k){return (k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
  s+='<path d="'+line+'L'+X(y)+' '+Y(0)+'L'+X(0)+' '+Y(0)+'Z" fill="var(--green)" opacity=".16"/>';
  s+='<path d="'+line+'" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>';
  var e=pts[pts.length-1];
  s+='<circle cx="'+e[0]+'" cy="'+e[1]+'" r="5" fill="var(--green)" stroke="var(--surface)" stroke-width="2"/>';
  s+='<text x="'+(e[0]-10)+'" y="'+(e[1]-10)+'" text-anchor="end" class="tx strong">'+fmtT(max)+' t</text>';
  s+='<text x="'+l+'" y="14" class="tx">'+t('chartY')+'</text><text x="'+(W-r)+'" y="'+(H-4)+'" text-anchor="end" class="tx">'+t('chartX')+'</text>';
  $('#chart').innerHTML=s;
}
function calc(){
  var n=+$('#inTrees').value,y=+$('#inYears').value;
  $('#outTrees').textContent=fmt(n);$('#outYears').textContent=y+' '+(y===1?t('yr1'):t('yrN'));
  var total=cum(n,y),perYear=n*uptake(y)/1000;
  $('#rTotal').textContent=fmtT(total);
  $('#rCars').textContent=fmt(perYear*1000/4600);
  $('#rShade').textContent=fmt(n*25/10000);
  drawChart(n,y);
}
$('#inTrees').addEventListener('input',calc);$('#inYears').addEventListener('input',calc);

  var hb=$('#habits');hb.innerHTML='';
  t('H').forEach(function(txt,i){
    var lab=document.createElement('label');lab.className='habit';lab.setAttribute('for',IDS[i]);
    lab.innerHTML='<input type="checkbox" id="'+IDS[i]+'"'+(saved.indexOf(IDS[i])>-1?' checked':'')+'><span>'+txt+'</span><small>'+KGS[i]+' '+t('kgyr')+'</small>';
    lab.querySelector('input').addEventListener('change',pledge);
    hb.appendChild(lab);
  });
}
function pledge(){
  var ids=[],kg=0;
  IDS.forEach(function(id,i){if($('#'+id).checked){ids.push(id);kg+=KGS[i];}});
  saved=ids;
  try{localStorage.setItem(KEY,JSON.stringify(ids))}catch(e){}
  $('#pKg').textContent=fmt(kg)+' '+t('kg');
  $('#pBar').style.width=(kg/maxKg*100)+'%';
  $('#pTxt').textContent=kg?t('plT1')(fmt(kg/22)):t('plT0');
}

/* ---------- language ---------- */
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(function(el){el.innerHTML=t(el.getAttribute('data-i'))});
  document.querySelectorAll('[data-al]').forEach(function(el){el.setAttribute('aria-label',t(el.getAttribute('data-al')))});
}
function setLang(l){
  lang=l;
  applyStatic();buildChips();render();calc();buildTabs();buildHabits();pledge();playLabel();
}
setLang(lang);
})();
</script>
